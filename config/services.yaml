# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Supercode par défaut (surchargé par l'espace /admin)
    App\Live\LiveConfig:
        arguments:
            $superCodeHash: '%env(string:LIVE_SUPERCODE_HASH)%'

    # Chiffrement des secrets enregistrés en base (clé API saisie dans /admin)
    App\Live\SecretBox:
        arguments:
            $appSecret: '%kernel.secret%'

    # API Organisateur Tick Africa : billetterie des séances et validation des billets du direct.
    # La clé saisie dans /admin remplace TICKAFRICA_API_KEY.
    App\Live\TickAfrica:
        arguments:
            $apiKey: '%env(string:TICKAFRICA_API_KEY)%'
            $apiUrl: '%env(string:TICKAFRICA_API_URL)%'

    # Évènements et directs, gérés dans /admin. Les liens ci-dessous sont ceux du
    # programme d'origine, utilisé seulement si la base n'a jamais pu être lue.
    App\Programme\Programme:
        arguments:
            $marina22: '%env(string:TICKAFRICA_SEANCE_MARINA_22)%'
            $marina28: '%env(string:TICKAFRICA_SEANCE_MARINA_28)%'
            $wologuede28: '%env(string:TICKAFRICA_SEANCE_WOLOGUEDE_28)%'

    # Affiche du premier écran, remplaçable dans /admin
    App\Site\Affiche:
        arguments:
            $dossier: '%kernel.project_dir%/var/affiche'

    # Photos des lieux envoyées dans /admin
    App\Site\PhotosLieux:
        arguments:
            $dossier: '%kernel.project_dir%/var/lieux'

    # Page /ventes : bilan des ventes, ouverte avec un code d'accès
    App\Controller\VentesController:
        arguments:
            $code: '%env(string:VENTES_CODE)%'

when@test:
    services:
        App\Site\Affiche:
            arguments:
                $dossier: '%kernel.project_dir%/var/affiche-test'
        App\Site\PhotosLieux:
            arguments:
                $dossier: '%kernel.project_dir%/var/lieux-test'
